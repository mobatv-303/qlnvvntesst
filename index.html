<script>
function hrmApp() {
    return {
        isLoggedIn: localStorage.getItem('hrm_logged_in') === 'true',
        role: localStorage.getItem('hrm_role') || 'staff',
        currentUser: localStorage.getItem('hrm_current_user') || '',
        loginType: 'staff',
        adminForm: { username: '', password: '' },
        selectedStaffName: '',
        loginError: '',
        newEmpName: '',
        searchKeyword: '',
        darkMode: localStorage.getItem('hrm_dark_mode') === 'true',
        showPasswordModal: false,
        pwdForm: { oldPwd: '', newPwd: '', confirmPwd: '' },
        passwordMsg: '',
        passwordError: false,
        currentView: localStorage.getItem('hrm_role') === 'admin' ? 'table' : 'staffregister',
        selectedTimelineDay: 't2',
        currentWeekOffset: 0,
        statsMonth: new Date().getMonth() + 1,
        statsYear: new Date().getFullYear(),
        days: [
            { key: 't2', name: 'Thứ 2' },
            { key: 't3', name: 'Thứ 3' },
            { key: 't4', name: 'Thứ 4' },
            { key: 't5', name: 'Thứ 5' },
            { key: 't6', name: 'Thứ 6' },
            { key: 't7', name: 'Thứ 7' },
            { key: 'cn', name: 'Chủ Nhật' }
        ],
        dayKeys: ['t2', 't3', 't4', 't5', 't6', 't7', 'cn'],
        employees: [],
        lockedWeeks: {},
        allWeeksCache: {}, // Bộ nhớ đệm chứa toàn bộ các tuần phục vụ thống kê tháng
        activeListeners: {}, // Quản lý listener tránh đăng ký trùng lặp

        init() {
            if (window.db && window.fbRef && window.fbOnValue) {
                const empRef = window.fbRef(window.db, 'hrm_smart_schedule_data/employees_list');
                window.fbOnValue(empRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const rawList = Array.isArray(data) 
                            ? data 
                            : Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        
                        // Giữ lại lịch đã tải trong bộ nhớ khi danh sách nhân viên cập nhật
                        this.employees = rawList.filter(Boolean).map(emp => {
                            const existing = this.employees.find(e => e.id === emp.id);
                            return {
                                id: emp.id,
                                name: emp.name,
                                schedule: existing && existing.schedule ? existing.schedule : {}
                            };
                        });
                        this.loadCurrentWeekData();
                    } else {
                        this.employees = [
                            { id: '1', name: 'Ngọc Hào', schedule: {} },
                            { id: '2', name: 'Anh Bình', schedule: {} },
                            { id: '3', name: 'Anh Đĩnh', schedule: {} },
                            { id: '4', name: 'Anh Vũ', schedule: {} },
                            { id: '5', name: 'anh Chiến', schedule: {} },
                            { id: '6', name: 'Anh Tú', schedule: {} },
                            { id: '7', name: 'Anh Hậu', schedule: {} },
                            { id: '8', name: 'Trung', schedule: {} },
                            { id: '9', name: 'Anh Xuân Huy', schedule: {} },
                            { id: '10', name: 'Công', schedule: {} },
                            { id: '11', name: 'Phạm phong', schedule: {} },
                            { id: '12', name: 'Duy Anh', schedule: {} },
                            { id: '13', name: 'Việt Nam', schedule: {} },
                            { id: '14', name: 'Anh Phong Gió', schedule: {} },
                            { id: '15', name: 'Khánh Nam', schedule: {} }
                        ];
                        this.saveEmployeesToStorage();
                        this.loadCurrentWeekData();
                    }
                });

                // Nếu đang ở màn hình thống kê tháng thì tải luôn toàn bộ lịch
                if (this.currentView === 'monthly') {
                    this.loadAllSchedulesForMonthlyStats();
                }
            }
        },

        loadCurrentWeekData() {
            if (!window.db || !window.fbRef) return;
            const weekKey = this.currentWeekKey;

            // Khởi tạo khung lịch mặc định ngay lập tức để UI không bị lỗi undefined
            this.employees.forEach(emp => {
                if (!emp.schedule) emp.schedule = {};
                if (!emp.schedule[weekKey]) {
                    emp.schedule[weekKey] = window.getDefaultWeekSchedule();
                }
            });

            // Tránh tạo listener trùng lặp cho cùng 1 tuần
            if (this.activeListeners[weekKey]) return;
            this.activeListeners[weekKey] = true;

            const lockRef = window.fbRef(window.db, `hrm_smart_schedule_data/lockedWeeks/${weekKey}`);
            window.fbOnValue(lockRef, (snapshot) => {
                this.lockedWeeks[weekKey] = snapshot.val() || false;
            });

            const weekRef = window.fbRef(window.db, `hrm_smart_schedule_data/schedules_by_week/${weekKey}`);
            window.fbOnValue(weekRef, (snapshot) => {
                const weekData = snapshot.val();
                this.allWeeksCache[weekKey] = weekData || {};
                this.employees.forEach(emp => {
                    if (!emp.schedule) emp.schedule = {};
                    if (weekData && weekData[emp.id]) {
                        emp.schedule[weekKey] = weekData[emp.id];
                    } else {
                        emp.schedule[weekKey] = window.getDefaultWeekSchedule();
                    }
                });
            });
        },

        // Hàm mới: Tải toàn bộ các tuần từ Firebase để phục vụ Thống kê tháng chính xác 100%
        loadAllSchedulesForMonthlyStats() {
            if (!window.db || !window.fbRef || this.activeListeners['all_schedules']) return;
            this.activeListeners['all_schedules'] = true;

            const allSchedulesRef = window.fbRef(window.db, 'hrm_smart_schedule_data/schedules_by_week');
            window.fbOnValue(allSchedulesRef, (snapshot) => {
                const allData = snapshot.val() || {};
                this.allWeeksCache = allData;
                Object.keys(allData).forEach(weekKey => {
                    const weekData = allData[weekKey];
                    this.employees.forEach(emp => {
                        if (!emp.schedule) emp.schedule = {};
                        if (weekData && weekData[emp.id]) {
                            emp.schedule[weekKey] = weekData[emp.id];
                        }
                    });
                });
            });
        },

        toggleDarkMode() {
            this.darkMode = !this.darkMode;
            localStorage.setItem('hrm_dark_mode', this.darkMode);
        },

        get filteredEmployees() {
            if (!this.searchKeyword.trim()) return this.employees;
            let keyword = this.searchKeyword.toLowerCase().trim();
            return this.employees.filter(e => e.name && e.name.toLowerCase().includes(keyword));
        },

        // Đã sửa lỗi lệch múi giờ UTC+7 (không dùng toISOString)
        get currentWeekKey() {
            let d = new Date();
            d.setDate(d.getDate() + (this.currentWeekOffset * 7));
            let day = d.getDay();
            let diff = d.getDate() - day + (day === 0 ? -6 : 1);
            let monday = new Date(d.setDate(diff));
            let yyyy = monday.getFullYear();
            let mm = String(monday.getMonth() + 1).padStart(2, '0');
            let dd = String(monday.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        },

        isCurrentWeekLocked() {
            return !!this.lockedWeeks[this.currentWeekKey];
        },

        toggleLockWeek() {
            const newStatus = !this.lockedWeeks[this.currentWeekKey];
            this.lockedWeeks[this.currentWeekKey] = newStatus;
            if (window.db && window.fbRef && window.fbSet) {
                window.fbSet(window.fbRef(window.db, `hrm_smart_schedule_data/lockedWeeks/${this.currentWeekKey}`), newStatus);
            }
        },

        getWeekDisplayString() {
            let parts = this.currentWeekKey.split('-');
            let monday = new Date(parts[0], parts[1] - 1, parts[2]);
            let sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            const formatDate = (date) => {
                let dd = String(date.getDate()).padStart(2, '0');
                let mm = String(date.getMonth() + 1).padStart(2, '0');
                let yyyy = date.getFullYear();
                return `${dd}/${mm}/${yyyy}`;
            };
            return `Tuần: ${formatDate(monday)} - ${formatDate(sunday)}`;
        },

        getDateStringForDay(dKey) {
            let parts = this.currentWeekKey.split('-');
            let d = new Date(parts[0], parts[1] - 1, parts[2]);
            let dayIndex = this.dayKeys.indexOf(dKey);
            d.setDate(d.getDate() + dayIndex);
            let dd = String(d.getDate()).padStart(2, '0');
            let mm = String(d.getMonth() + 1).padStart(2, '0');
            return `${dd}/${mm}`;
        },

        changeWeek(direction) {
            this.currentWeekOffset += direction;
            this.loadCurrentWeekData();
        },

        resetToCurrentWeek() {
            this.currentWeekOffset = 0;
            this.loadCurrentWeekData();
        },

        getDayFullName(dKey) {
            const found = this.days.find(d => d.key === dKey);
            return found ? found.name : '';
        },

        getStaffsForShift(dKey, shiftName) {
            let staffList = [];
            this.employees.forEach(emp => {
                let weekSched = emp.schedule && emp.schedule[this.currentWeekKey];
                if (weekSched && weekSched[dKey] && weekSched[dKey][shiftName]) {
                    staffList.push(emp.name);
                }
            });
            return staffList;
        },

        get currentStaffData() {
            return this.employees.find(e => e.name === this.currentUser);
        },

        getEmpTotalShifts(emp) {
            let total = 0;
            if (!emp.schedule || !emp.schedule[this.currentWeekKey]) return 0;
            this.dayKeys.forEach(dKey => {
                let daySched = emp.schedule[this.currentWeekKey][dKey];
                if (daySched) {
                    if (daySched.ca1) total++;
                    if (daySched.ca2) total++;
                    if (daySched.ca3) total++;
                }
            });
            return total;
        },

        getTotalAssignedShifts() {
            let total = 0;
            this.employees.forEach(emp => { total += this.getEmpTotalShifts(emp); });
            return total;
        },

        getMonthlyStatsForEmp(emp) {
            let stats = { ca1: 0, ca2: 0, ca3: 0, total: 0 };
            if (!emp.schedule) return stats;

            Object.keys(emp.schedule).forEach(mondayKey => {
                let parts = mondayKey.split('-');
                if (parts.length !== 3) return;
                let mondayDate = new Date(parts[0], parts[1] - 1, parts[2]);
                let weekData = emp.schedule[mondayKey];
                if (!weekData) return;

                for (let i = 0; i < 7; i++) {
                    let currDate = new Date(mondayDate);
                    currDate.setDate(mondayDate.getDate() + i);
                    if (currDate.getMonth() + 1 === parseInt(this.statsMonth) && currDate.getFullYear() === parseInt(this.statsYear)) {
                        let dKey = this.dayKeys[i];
                        let daySched = weekData[dKey];
                        if (daySched) {
                            if (daySched.ca1) { stats.ca1++; stats.total++; }
                            if (daySched.ca2) { stats.ca2++; stats.total++; }
                            if (daySched.ca3) { stats.ca3++; stats.total++; }
                        }
                    }
                }
            });
            return stats;
        },

        getPeakDayName() {
            let maxCount = -1;
            let peakDay = 'Chưa có';
            this.days.forEach(day => {
                let count = this.getStaffsForShift(day.key, 'ca1').length +
                            this.getStaffsForShift(day.key, 'ca2').length +
                            this.getStaffsForShift(day.key, 'ca3').length;
                if (count > maxCount) {
                    maxCount = count;
                    peakDay = day.name;
                }
            });
            return maxCount > 0 ? `${peakDay} (${maxCount} lượt)` : 'Không có';
        },

        toggleFullEmp(emp, status) {
            if (this.isCurrentWeekLocked() && this.role === 'staff') {
                alert('Tuần này đã bị khóa lịch, không thể thay đổi!');
                return;
            }
            if (!emp.schedule[this.currentWeekKey]) {
                emp.schedule[this.currentWeekKey] = window.getDefaultWeekSchedule();
            }
            this.dayKeys.forEach(dKey => {
                emp.schedule[this.currentWeekKey][dKey].ca1 = status;
                emp.schedule[this.currentWeekKey][dKey].ca2 = status;
                emp.schedule[this.currentWeekKey][dKey].ca3 = status;
            });
            this.saveEmpSchedule(emp);
        },

        handleAdminLogin() {
            const currentPwd = localStorage.getItem('hrm_admin_password') || 'admin123';
            if (this.adminForm.username === 'admin' && this.adminForm.password === currentPwd) {
                this.isLoggedIn = true;
                this.role = 'admin';
                this.currentUser = 'Admin';
                this.currentView = 'table';
                localStorage.setItem('hrm_logged_in', 'true');
                localStorage.setItem('hrm_role', 'admin');
                localStorage.setItem('hrm_current_user', 'Admin');
                this.loginError = '';
            } else {
                this.loginError = 'Tên đăng nhập hoặc mật khẩu quản trị không đúng!';
            }
        },

        handleStaffLogin() {
            if (!this.selectedStaffName) {
                this.loginError = 'Vui lòng chọn tên nhân viên của bạn!';
                return;
            }
            this.isLoggedIn = true;
            this.role = 'staff';
            this.currentUser = this.selectedStaffName;
            this.currentView = 'staffregister';
            localStorage.setItem('hrm_logged_in', 'true');
            localStorage.setItem('hrm_role', 'staff');
            localStorage.setItem('hrm_current_user', this.selectedStaffName);
            this.loginError = '';
        },

        changeAdminPassword() {
            const currentPwd = localStorage.getItem('hrm_admin_password') || 'admin123';
            if (this.pwdForm.oldPwd !== currentPwd) {
                this.passwordError = true;
                this.passwordMsg = 'Mật khẩu hiện tại không chính xác!';
                return;
            }
            if (!this.pwdForm.newPwd || this.pwdForm.newPwd.length < 6) {
                this.passwordError = true;
                this.passwordMsg = 'Mật khẩu mới phải có ít nhất 6 ký tự!';
                return;
            }
            if (this.pwdForm.newPwd !== this.pwdForm.confirmPwd) {
                this.passwordError = true;
                this.passwordMsg = 'Xác nhận mật khẩu mới không khớp!';
                return;
            }
            localStorage.setItem('hrm_admin_password', this.pwdForm.newPwd);
            this.passwordError = false;
            this.passwordMsg = 'Đổi mật khẩu thành công!';
            this.pwdForm = { oldPwd: '', newPwd: '', confirmPwd: '' };
            setTimeout(() => { this.showPasswordModal = false; this.passwordMsg = ''; }, 1500);
        },

        logout() {
            this.isLoggedIn = false;
            this.adminForm = { username: '', password: '' };
            this.selectedStaffName = '';
            this.loginType = 'staff';
            localStorage.removeItem('hrm_logged_in');
            localStorage.removeItem('hrm_role');
            localStorage.removeItem('hrm_current_user');
        },

        addEmployee() {
            if (!this.newEmpName.trim()) return;
            const newId = 'emp_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            const newEmp = { id: newId, name: this.newEmpName.trim(), schedule: {} };
            newEmp.schedule[this.currentWeekKey] = window.getDefaultWeekSchedule();
            this.employees.push(newEmp);
            this.newEmpName = '';
            this.saveEmployeesToStorage();
        },

        deleteEmployee(id) {
            if (confirm('Bạn có chắc chắn muốn xóa nhân viên này khỏi hệ thống?')) {
                this.employees = this.employees.filter(e => e.id !== id);
                this.saveEmployeesToStorage();
            }
        },

        clearAllShifts() {
            if (this.isCurrentWeekLocked()) {
                alert('Tuần này đã bị khóa lịch!');
                return;
            }
            if (confirm('Bạn có chắc chắn muốn bỏ chọn toàn bộ ca làm việc trong tuần này?')) {
                this.employees.forEach(emp => {
                    if (!emp.schedule) emp.schedule = {};
                    emp.schedule[this.currentWeekKey] = window.getDefaultWeekSchedule(false);
                });
                this.saveToStorage();
            }
        },

        // Đã sửa: Chỉ lưu id và name, không lưu kèm object schedule gây phình Database
        saveEmployeesToStorage() {
            if (window.db && window.fbRef && window.fbSet) {
                const cleanEmployees = this.employees.map(emp => ({
                    id: emp.id,
                    name: emp.name
                }));
                window.fbSet(window.fbRef(window.db, 'hrm_smart_schedule_data/employees_list'), cleanEmployees).catch((err) => {
                    console.error("Lỗi khi lưu danh sách nhân viên lên Firebase:", err);
                });
            }
        },

        // Hàm mới: Chỉ lưu lịch của đúng nhân viên vừa thao tác (Chống ghi đè khi nhiều người cùng tích chọn)
        saveEmpSchedule(emp) {
            if (!emp) return;
            if (this.isCurrentWeekLocked() && this.role === 'staff') {
                alert('Lịch tuần này đã bị khóa, thao tác của bạn không được lưu.');
                return;
            }
            if (!emp.schedule || !emp.schedule[this.currentWeekKey]) return;

            if (window.db && window.fbRef && window.fbSet) {
                const empWeekRef = window.fbRef(window.db, `hrm_smart_schedule_data/schedules_by_week/${this.currentWeekKey}/${emp.id}`);
                window.fbSet(empWeekRef, emp.schedule[this.currentWeekKey]);
            }
        },

        // Giữ lại saveToStorage() cho thao tác "Xóa toàn bộ ca" của Admin hoặc tương thích ngược
        saveToStorage() {
            if (this.isCurrentWeekLocked() && this.role === 'staff') {
                alert('Lịch tuần này đã bị khóa, thao tác của bạn không được lưu.');
                return;
            }
            if (this.role === 'staff' && this.currentStaffData) {
                this.saveEmpSchedule(this.currentStaffData);
                return;
            }
            let currentWeekScheduleData = {};
            this.employees.forEach(emp => {
                if (!emp.schedule) emp.schedule = {};
                if (!emp.schedule[this.currentWeekKey]) {
                    emp.schedule[this.currentWeekKey] = window.getDefaultWeekSchedule();
                }
                currentWeekScheduleData[emp.id] = emp.schedule[this.currentWeekKey];
            });
            if (window.db && window.fbRef && window.fbSet) {
                window.fbSet(window.fbRef(window.db, `hrm_smart_schedule_data/schedules_by_week/${this.currentWeekKey}`), currentWeekScheduleData);
            }
        },

        exportDailyReportWord(dKey) {
            let dayName = this.getDayFullName(dKey);
            let dateStr = this.getDateStringForDay(dKey);
            let ca1List = this.getStaffsForShift(dKey, 'ca1');
            let ca2List = this.getStaffsForShift(dKey, 'ca2');
            let ca3List = this.getStaffsForShift(dKey, 'ca3');
            let htmlContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Báo Cáo</title>
                <style>body { font-family: 'Times New Roman'; font-size: 14pt; } table { border-collapse: collapse; width: 100%; } th, td { border: 1px solid black; padding: 8px; vertical-align: top; }</style></head>
                <body>
                <table>
                    <tr style="background-color: #f2f2f2;"><td style="text-align:center; font-weight:bold;">Ca</td><td style="font-weight:bold;">${dayName} ngày ${dateStr}</td><td></td></tr>
                    <tr><td style="text-align:center; font-weight:bold;">1</td><td>${ca1List.map((n, i) => `${i+1}. ${n}`).join('<br>') || '<em>Không có</em>'}</td><td></td></tr>
                    <tr><td style="text-align:center; font-weight:bold;">2</td><td>${ca2List.map((n, i) => `${i+1}. ${n}`).join('<br>') || '<em>Không có</em>'}</td><td><span style="color:red;">trực trưa: ${ca2List.slice(0, 2).join(', ')}</span><br><br><span style="color:red;">Trực Tối: ${ca3List.slice(0, 2).join(', ')}</span></td></tr>
                    <tr><td style="text-align:center; font-weight:bold;">3</td><td>${ca3List.map((n, i) => `${i+1}. ${n}`).join('<br>') || '<em>Không có</em>'}</td><td></td></tr>
                </table>
                </body></html>
            `;
            let blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `BaoCao_${dayName}_${dateStr.replace('/', '-')}.doc`;
            a.click();
        },

        exportWeeklyReportWord() {
            let weekStr = this.getWeekDisplayString();
            let daysHtml = '';
            this.days.forEach(day => {
                let dateStr = this.getDateStringForDay(day.key);
                let ca1List = this.getStaffsForShift(day.key, 'ca1');
                let ca2List = this.getStaffsForShift(day.key, 'ca2');
                let ca3List = this.getStaffsForShift(day.key, 'ca3');
                daysHtml += `
                    <h3>${day.name} - Ngày ${dateStr}</h3>
                    <table>
                        <tr style="background-color: #f2f2f2;"><td style="text-align:center;font-weight:bold;">Ca</td><td style="font-weight:bold;">Danh sách</td><td>Ghi chú</td></tr>
                        <tr><td style="text-align:center;font-weight:bold;">1</td><td>${ca1List.map((n, i) => `${i+1}. ${n}`).join('<br>') || '<em>Không có</em>'}</td><td></td></tr>
                        <tr><td style="text-align:center;font-weight:bold;">2</td><td>${ca2List.map((n, i) => `${i+1}. ${n}`).join('<br>') || '<em>Không có</em>'}</td><td><span style="color:red;">trực trưa: ${ca2List.slice(0, 2).join(', ')}</span><br><br><span style="color:red;">Trực Tối: ${ca3List.slice(0, 2).join(', ')}</span></td></tr>
                        <tr><td style="text-align:center;font-weight:bold;">3</td><td>${ca3List.map((n, i) => `${i+1}. ${n}`).join('<br>') || '<em>Không có</em>'}</td><td></td></tr>
                    </table><br>
                `;
            });
            let htmlContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Báo Cáo Cả Tuần</title>
                <style>body { font-family: 'Times New Roman'; font-size: 14pt; } table { border-collapse: collapse; width: 100%; } th, td { border: 1px solid black; padding: 6px; vertical-align: top; }</style></head>
                <body>
                    <h2 style="text-align:center;">BÁO CÁO LỊCH TRỰC TỔNG HỢP</h2>
                    <p style="text-align:center; font-weight:bold;">${weekStr}</p><hr>${daysHtml}
                </body></html>
            `;
            let blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `BaoCao_TongHop.doc`;
            a.click();
        }
    }
}

window.getDefaultWeekSchedule = function(checked = false) {
    let sched = {};
    ['t2', 't3', 't4', 't5', 't6', 't7', 'cn'].forEach(d => {
        sched[d] = { ca1: checked, ca2: checked, ca3: checked };
    });
    return sched;
}
</script>
